<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y. — Personal AI Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- LiveKit Web Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Remote Agent Audio Playback Element -->
    <audio id="remote-audio" autoplay style="display:none;"></audio>

    <!-- Three.js WebGL Canvas -->
    <div id="canvas-container"></div>
    <div class="vignette-overlay"></div>

    <!-- UI Overlay Layer -->
    <div class="cinematic-ui">

        <!-- Top Navigation Bar -->
        <header class="top-bar">
            <div class="top-left">
                <span class="brand-title">F.R.I.D.A.Y</span>
                <span class="brand-status">ONLINE</span>
            </div>

            <div class="top-center">
                <h1 class="center-title">F.R.I.D.A.Y</h1>
                <span class="center-subtitle">PERSONAL AI ASSISTANT</span>
            </div>

            <div class="top-right">
                <div class="top-actions">
                    <button class="action-btn" title="Audio Settings"><i class="fa-solid fa-chart-simple"></i></button>
                    <button class="action-btn" title="Settings"><i class="fa-solid fa-gear"></i></button>
                    <button class="action-btn" title="Power"><i class="fa-solid fa-power-off"></i></button>
                </div>
                <span class="clock-display" id="clock-time">23:47</span>
            </div>
        </header>

        <!-- Left Side Minimal Widgets -->
        <div class="side-widgets widget-left">
            <!-- Middle Left Status -->
            <div class="status-indicator">
                <div class="target-ring-mini">
                    <span class="ring-dot"></span>
                </div>
                <div class="status-text-group">
                    <span class="status-lbl">SYSTEM</span>
                    <span class="status-val cyan">NORMAL</span>
                </div>
            </div>

            <!-- Bottom Left Radial Gauge -->
            <div class="radial-gauge-container">
                <svg class="gauge-svg" viewBox="0 0 70 70">
                    <circle class="gauge-bg" cx="35" cy="35" r="28"></circle>
                    <circle class="gauge-fill" cx="35" cy="35" r="28" stroke-dasharray="176" stroke-dashoffset="49"></circle>
                </svg>
                <span class="gauge-text">72%</span>
            </div>
        </div>

        <!-- Right Side Minimal Widgets -->
        <div class="side-widgets widget-right">
            <!-- Middle Right Audio Listening Visualizer -->
            <div class="listening-container">
                <canvas id="right-audio-canvas" width="160" height="45"></canvas>
                <span class="listening-lbl" id="listening-lbl">I'M LISTENING</span>
            </div>

            <!-- Bottom Right Weather Widget -->
            <div class="weather-widget">
                <div class="weather-main">
                    <i class="fa-solid fa-cloud-sun weather-icon"></i>
                    <span class="weather-temp">27°C</span>
                </div>
                <span class="weather-desc">SCATTERED CLOUDS</span>
            </div>
        </div>

        <!-- Center Bottom Tap To Speak Circle -->
        <div class="center-bottom-trigger">
            <button class="mic-circle-btn" id="btn-mic">
                <div class="mic-ring-outer"></div>
                <div class="mic-ring-inner"></div>
                <i class="fa-solid fa-microphone mic-icon"></i>
            </button>
            <span class="trigger-label" id="trigger-label">TAP TO SPEAK</span>
        </div>

    </div>

    <!-- Main JavaScript Logic -->
    <script src="app.js"></script>
</body>
</html>
